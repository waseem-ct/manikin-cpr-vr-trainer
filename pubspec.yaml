name: manikin_simulator
description: CPR manikin trainer that streams live compression data to a VR headset.
publish_to: 'none'

version: 1.0.11+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Architecture
  provider: ^6.1.5+1
  go_router: ^17.3.0
  get_it: ^9.2.1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.3

  # Bluetooth + platform
  flutter_blue_plus: ^1.33.4
  permission_handler: ^11.3.1
  app_settings: ^5.1.1
  wakelock_plus: ^1.2.8

  # Networking
  http: ^1.3.0

  # UI
  google_fonts: ^6.3.3
  lottie: ^3.3.1
  percent_indicator: ^4.2.2
  syncfusion_flutter_gauges: ^28.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/launcher_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#6368F8"
  adaptive_icon_foreground: "assets/launcher/launcher_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/game_images/
    - assets/other_images/
    - assets/json_and_audio_files/
