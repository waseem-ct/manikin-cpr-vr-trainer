pluginManagement {
    // Define a method to get the Flutter SDK path from the local.properties file.
    def flutterSdkPath = {
        def properties = new Properties()  // Create a new Properties object to load properties.
        file("local.properties").withInputStream { properties.load(it) }// Load properties from the local.properties file.
        def flutterSdkPath = properties.getProperty("flutter.sdk") // Get the Flutter SDK path.
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties" // Ensure the Flutter SDK path is set.
        return flutterSdkPath   // Return the Flutter SDK path.
    }



    // Store the Flutter SDK path in the settings object for later use.
    settings.ext.flutterSdkPath = flutterSdkPath()

    // Include the Flutter tools gradle configuration from the Flutter SDK.
    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        // Add Google's Maven repository for Android dependencies.
        google()

        // Add Maven Central repository for general Java libraries.
        mavenCentral()

        // Add Gradle Plugin Portal for accessing various Gradle plugins.
        gradlePluginPortal()
    }
}

plugins {
    // Load the Flutter plugin for Flutter integration in the project.
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"

    // Optionally load the Android application plugin; currently disabled.
    // id "com.android.application" version '7.2.1' apply false
    // Load the Android application plugin with the specified version (7.4.2).
    // id "com.android.application" version '7.4.2' apply false
     id "com.android.application" version '8.11.1' apply false

    // Load the Kotlin Android plugin for Kotlin support in Android.
    // id "org.jetbrains.kotlin.android" version "2.0.20" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false

    // Optionally load Google services plugin; currently disabled.
     id "com.google.gms.google-services" version "4.4.2" apply false
}

// Include the main app module in the build.
include ":app"
